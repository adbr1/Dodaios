# Native build of the review branch; no release, tag or default-branch update.
name: French Apple Silicon installer

on:
  push:
    branches:
      - feat/minimal-assistant-macos-icon
    paths:
      - .github/workflows/french-arm64-build.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: french-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
    steps:
      - name: Check out the installer branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require native Apple Silicon
        run: test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the existing native build dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/pip_install.py -e ".[desktop,desktop-macos,dev]"

      - name: Test the macOS icon geometry
        run: python -m pytest -q tests/unit/packaging/test_macos_icon_geometry.py tests/unit/ui/test_platform_icon_surfaces.py

      - name: Test French settings persistence and native localizations
        run: python -m pytest -q tests/integration/test_ui_language_route.py tests/unit/ui/test_french_ui_locale.py tests/unit/packaging/test_macos_privacy_strings.py tests/unit/i18n

      - name: Test French selection and Agents navigation
        working-directory: dodaios/ui/web/frontend
        run: |
          npm ci
          npm test -- src/i18n/fr-locale-parity.test.ts src/views/settings/FrenchLanguageSelection.test.tsx src/components/layout/Sidebar.test.tsx --maxWorkers=3

      - name: Build the DMG using the existing packaging script
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/build.sh 2>&1 | tee macos-build.log

      - name: Verify the frozen app bundle
        run: python scripts/ci/check_frozen_macos_app.py --app dist/Dodaios.app

      - name: Verify French dictionaries and Agents in the packaged frontend
        run: python scripts/ci/check_french_frontend.py --app dist/Dodaios.app

      - name: Verify the DMG and record its checksum
        env:
          DMG: dist/installers/Dodaios-macOS-${{ matrix.arch }}.dmg
        run: |
          set -euo pipefail
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          printf '%s\n' 'Development build: ad-hoc signed and not Apple-notarized.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dodaios-macOS-${{ matrix.arch }}
          path: |
            dist/installers/Dodaios-macOS-${{ matrix.arch }}.dmg
            dist/installers/Dodaios-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-build-log-${{ matrix.arch }}
          path: macos-build.log
          if-no-files-found: ignore
          retention-days: 14
